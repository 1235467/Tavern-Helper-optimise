name: bundle

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      # tag if [release...] is in the commit message subject
      - id: autotag_check
        shell: bash
        run: |-
          message=$(git log -n 1 --pretty=format:"%s")
          if [[ $message == *"[release]"* || $message == *"[release patch]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          elif [[ $message == *"[release minor]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ $message == *"[release major]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ github.ref != 'refs/heads/dev' && github.ref_type != 'tag' && steps.autotag_check.outputs.should_tag == 'true' }}
        id: autotag
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          bump: ${{ steps.autotag_check.outputs.bump }}
          release-branch: ''
          dry-run: true
      - if: ${{ github.ref != 'refs/heads/dev' && github.ref_type == 'tag' }}
        id: manual_tag
        env:
          VALUE: ${{ github.ref }}
        run: |-
          export TAG=${VALUE##refs/tags/}
          echo result=$TAG >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref != 'refs/heads/dev' && github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        id: package_version
        run: |-
          echo 'result="version": "${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}"' >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref != 'refs/heads/dev' && github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: manifest.json
          find: '"version": "\d+\.\d+\.\d+"'
          replace: ${{ steps.package_version.outputs.result }}
          regex: true
      - if: ${{ github.ref != 'refs/heads/dev' && github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: package.json
          find: '"version": "\d+\.\d+\.\d+"'
          replace: ${{ steps.package_version.outputs.result }}
          regex: true

      # rust toolchain for the th-core WASM core
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - name: Build th_core.wasm (+ wasm-opt -Oz)
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path crates/th-core/Cargo.toml && node tools/opt_wasm.mjs

      # js deps + build (node first — binaryen comes from npm, not apt:
      # apt's binaryen-108 is too old for modern-rustc wasm and silently
      # fails the -Oz pass; npm ships a current binaryen)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - run: npm i -g binaryen
      - run: pnpm i
      - run: pnpm run build:env
      - run: ST_IMPORT_DEPTH=5 pnpm run build
      - name: Merge @types files to a single file
        run: |-
          mkdir -p dist
          cat @types/**/*.d.ts > dist/@types.txt
      - name: Compress @types files to a zip
        run: |-
          tar \
            --sort=name \
            --mtime='UTC 1980-02-01' \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -caf ../dist/@types.zip .
        working-directory: '@types'

      # contract tests as a build gate (wasm vs JS-fallback parity)
      - name: Contract tests
        run: node --test 'tests/contract/*.test.mjs'

      # commit
      - uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] Bundle'
      - if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |-
          git tag -d ${{ steps.manual_tag.outputs.result }}
          git push --delete origin ${{ steps.manual_tag.outputs.result }}
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        shell: bash
        run: |-
          git tag ${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}
          git push --tags
